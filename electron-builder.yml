appId: ai.deepseek.harness.desktop
productName: DeepSeek Harness Desktop
electronDist: node_modules/electron/dist
icon: assets/harness-orca.svg
directories:
  output: release
compression: store
files:
  - dist/**
  - assets/harness-orca.svg
  - assets/harness-orca.ico
  - assets/harness-orca.icns
  - package.json
asar: true
asarUnpack:
  - resources/runtime/**
  - '**/*.node'
extraResources:
  - from: resources/runtime
    to: runtime
    filter:
      - '**/*'
mac:
  icon: assets/harness-orca.icns
  identity: null
  hardenedRuntime: false
  target:
    - dmg
  category: public.app-category.developer-tools
win:
  icon: assets/harness-orca.ico
  target:
    - nsis
  signExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/harness-orca.ico
  uninstallerIcon: assets/harness-orca.ico
